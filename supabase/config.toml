# Supabase CLI configuration for LOCAL development (`supabase start`).
# Production settings are configured in the Supabase dashboard (docs/DEPLOYMENT.md).
project_id = "gumado"

[api]
enabled = true
port = 54321
schemas = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 16

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/reset-password"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
# Staff join by invitation only.
enable_signup = false

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true

[auth.password]
min_length = 10

[storage]
enabled = true
file_size_limit = "50MiB"

[functions.invite-user]
verify_jwt = true
