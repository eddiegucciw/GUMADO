name: Build GUMADO

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install packages
        run: npm install

      - name: Build the website
        run: npx vite build

      - name: Zip the website
        run: cd dist && zip -r ../GUMADO-web.zip .

      - name: Wrap it as an Android app
        run: |
          npm install --no-save @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init GUMADO com.gumado.app --web-dir dist
          npx cap add android
          npx cap sync android

      - name: Build the APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../GUMADO.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: GUMADO build ${{ github.run_number }}
          files: |
            GUMADO.apk
            GUMADO-web.zip